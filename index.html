
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

       <!-- start screen -->
       <div class="screen active" id="strat-screen">
        <h1>Testing my homeis🥀 !</h1>
        <p>How much You know me</p>
        <button id="start-btn">Start Quiz</button>
       </div>

       <div class="screen" id="quiz-screen">

            <div class="quiz-header">
            <h2 id="question-text">Question goes here</h2>

            <div class="quiz-info">
                <p>
                    question <span id="current-question">1</span>
                    of <span id="total-questions">5</span>
                </p>

                <p>
                    Score: <span id="score">0</span>
                </p>
            </div>
            </div>

            <div class="answers-container" id="answers-container">
              <!-- answer buttons will be inserted here -->
            </div>

            <div class="progres-bar">
                <div class="progress" id="progress"></div>
            </div>

       </div>

       <div id="result-screen" class="screen">
        <h1>Quiz Results</h1>

        <div class="result-info">
            <p>
                You Score <span id="final-score">0</span>
                out of <span id="max-score">5</span>
            </p>

            <div id="result-message">Good Job!</div>
        </div>

        <button id="restrat-btn">Restrat Quiz</button>
       </div>

    </div>

    <script>
        // DOM ELEMENTS
        const startScreen = document.getElementById("strat-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const startButton = document.getElementById("start-btn");
        const questionText = document.getElementById("question-text");
        const answersContainer = document.getElementById("answers-container");
        const currentQuestionSpan = document.getElementById("current-question");
        const totalQuestionsSpan = document.getElementById("total-questions");
        const scoreSpan = document.getElementById("score");
        const finalScoreSpan = document.getElementById("final-score");
        const maxScoreSpan = document.getElementById("max-score");
        const resultMessage = document.getElementById("result-message");
        const restartButton = document.getElementById("restrat-btn");
        const progressBar = document.getElementById("progress");

        // Quiz questions
        const quizQuestions = [
          {
            question: "What is My last Name?",
            answers: [
              { text: "Muuse", correct: false },
              { text: "Ahmed", correct: false },
              { text: "Hussein", correct: true },
              { text: "Ali", correct: false },
            ],
          },
          {
            question: "What is My College Name?",
            answers: [
              { text: "JJUN", correct: false },
              { text: "Hone College", correct: false },
              { text: "Niggers College", correct: false },
              { text: "JPTC", correct: true },
            ],
          },
          {
            question: "What is my Role-based?",
            answers: [
              { text: "Devops", correct: false },
              { text: "machine learning", correct: false },
              { text: "Full stack (Aka Larping Aka cluade code user 😭🥀)", correct: true },
              { text: "Data Analyst", correct: false },
            ],
          },
          {
            question: "What is My Type?",
            answers: [
              { text: "latina", correct: true },
              { text: "short girl", correct: true },
              { text: "black girl", correct: true },
              { text: "snow bunny", correct: true },
              { text: "everything a live", correct: true },
            ],
          },
          {
            question: "What am i to you?",
            answers: [
              { text: "ur daddy", correct: true }, 
              { text: "ur father", correct: true },
              { text: "nigga with big dih", correct: true },
              { text: "ur father in law", correct: true },
            ],
          },
        ];

        // quiz state vars
        let currentQuestionIndex = 0;
        let score = 0;
        let answersDisabled = false;

        totalQuestionsSpan.textContent = quizQuestions.length;
        maxScoreSpan.textContent = quizQuestions.length;

        // event listener
        startButton.addEventListener("click", startQuiz);
        restartButton.addEventListener("click", restartQuiz);

        function startQuiz() {
            // RESET VARS
            currentQuestionIndex = 0;
            score = 0;
            scoreSpan.textContent = score;

            startScreen.classList.remove("active");
            resultScreen.classList.remove("active");
            quizScreen.classList.add("active");

            showQuestion();
        }

        function showQuestion() {
            // reset state
            answersDisabled = false;

            const currentQuestion = quizQuestions[currentQuestionIndex];

            currentQuestionSpan.textContent = currentQuestionIndex + 1;

            const progressPercent =
                ((currentQuestionIndex + 1) / quizQuestions.length) * 100;

            progressBar.style.width = progressPercent + "%";
            questionText.textContent = currentQuestion.question;

            answersContainer.innerHTML = "";

            currentQuestion.answers.forEach(answer => {
                const button = document.createElement("button");
                button.textContent = answer.text;
                button.classList.add("answer-btn");

                button.dataset.correct = answer.correct;

                button.addEventListener("click", SelectAnswer);

                answersContainer.appendChild(button);
            });
        }

        function SelectAnswer(event) {
            // optimization check
            if (answersDisabled) return;

            answersDisabled = true;

            const selectedButton = event.target;
            const isCorrect = selectedButton.dataset.correct === "true";

            Array.from(answersContainer.children).forEach((button) => {
                if (button.dataset.correct === "true") {
                    button.classList.add("correct");
                } else if (button === selectedButton) {
                    button.classList.add("incorrect");
                }
            });

            if (isCorrect) {
                score++;
                scoreSpan.textContent = score;
            }

            setTimeout(() => {
                currentQuestionIndex++;

                if (currentQuestionIndex < quizQuestions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1000);
        }

        function showResult() {
            quizScreen.classList.remove("active");
            resultScreen.classList.add("active");

            finalScoreSpan.textContent = score;

            const percentage = (score / quizQuestions.length) * 100;

            if (percentage === 100) {
                resultMessage.textContent = "Perfect! You're a genius!";
            } else if (percentage >= 80) {
                resultMessage.textContent = "Great job! You know your stuff!";
            } else if (percentage >= 60) {
                resultMessage.textContent = "Good effort! Keep learning!";
            } else if (percentage >= 40) {
                resultMessage.textContent = "Not bad! Try again!";
            } else {
                resultMessage.textContent = "Keep studying! You'll get better!";
            }
        }

        function restartQuiz() {
            resultScreen.classList.remove("active");
            startQuiz();
        }
    </script>
</body>
</html>
